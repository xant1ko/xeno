services:
  mongodb:
    ports:
      - "${MONGO_PORT:-27017}:27017"

  api:
    build:
      target: development
    environment:
      NODE_ENV: development
    command: npm run start:dev
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./api-v1:/app
      - api-node-modules:/app/node_modules

  web:
    build:
      target: development
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
      VITE_API_URL: /api/v1
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/', response => process.exit(response.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
    volumes:
      - ./web:/app
      - web-node-modules:/app/node_modules

volumes:
  api-node-modules:
    driver: local
  web-node-modules:
    driver: local
