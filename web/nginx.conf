# Nginx одновременно отдаёт SPA и проксирует API, поэтому браузеру не требуется CORS.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # URI не переписывается: /api/v1/* поступает API в исходном виде.
    location /api/ {
        # Docker DNS разрешает имя сервиса при запросе и переживает перезапуск API.
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $api_upstream api;
        proxy_pass http://$api_upstream:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Файлы с хешем в имени Vite может безопасно кэшировать надолго.
    location ~* \.(?:css|js|mjs|map|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Неизвестные маршруты принадлежат React Router и должны вернуть index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
