services:

  mongodb:
    image: mongo:7.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?MONGO_INITDB_ROOT_USERNAME is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?MONGO_INITDB_ROOT_PASSWORD is required}
    volumes:
      - mongodb-data:/data/db
    networks:
      - xeno
    restart: unless-stopped

  api:
    depends_on:
      mongodb:
        condition: service_started
    build:
      context: ./api-v1
      target: production
    environment:
      NODE_ENV: production
      PORT: 8000
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DATABASE: ${MONGO_DATABASE:?MONGO_DATABASE is required}
      MONGO_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?MONGO_INITDB_ROOT_USERNAME is required}
      MONGO_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?MONGO_INITDB_ROOT_PASSWORD is required}
      MONGO_AUTH_SOURCE: admin
      PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-8}
      PASSWORD_MAX_LENGTH: ${PASSWORD_MAX_LENGTH:-128}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      JWT_COOKIE_SECURE: ${JWT_COOKIE_SECURE:-true}
      JWT_COOKIE_MAX_AGE_MS: ${JWT_COOKIE_MAX_AGE_MS:-86400000}
    networks:
      - xeno
    restart: unless-stopped

  web:
    depends_on:
      api:
        condition: service_started
    build:
      context: ./web
      target: production
      args:
        VITE_API_URL: /api/v1
    networks:
      - xeno
    restart: unless-stopped

  nginx-revers:
    ports:
      - "8090:443"
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_started
    networks:
      - xeno
    build:
      context: ./nginx-revers
      target: production
    volumes:
      - ${XENO_TLS_CERT:?XENO_TLS_CERT is required}:/etc/nginx/ssl/fullchain.pem:ro
      - ${XENO_TLS_KEY:?XENO_TLS_KEY is required}:/etc/nginx/ssl/privkey.pem:ro
    restart: unless-stopped

networks:
  xeno:
    driver: bridge

volumes:
  mongodb-data:
    driver: local


